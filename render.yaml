services:
  - type: web
    name: scout-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -e ".[dev]" openai pillow
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: WEBCMD_MODE
        value: mock
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
